<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMA Link — สร้างคำขอใหม่</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="wrap" style="max-width:560px">
  <div class="top">
    <div>
      <h1>สร้างคำขอหายา</h1>
      <p class="sub" id="sub">กำลังโหลด...</p>
    </div>
    <div class="who">
      <strong id="whoName">—</strong>
      <span id="whoRole"></span>
    </div>
  </div>

  <form id="form" class="card" hidden>
    <label for="product">รายการยาที่ต้องการ</label>
    <select id="product" required></select>

    <div class="two">
      <div>
        <label for="qty">จำนวน</label>
        <input id="qty" type="number" min="1" step="1" value="10" required>
      </div>
      <div>
        <label for="unit">หน่วย</label>
        <select id="unit">
          <option>แผง</option><option>กล่อง</option><option>ขวด</option>
          <option>ซอง</option><option>ลัง</option><option>ชิ้น</option>
        </select>
      </div>
    </div>

    <label for="urgency">ความเร่งด่วน</label>
    <select id="urgency"></select>

    <label for="note">รายละเอียดเพิ่มเติม</label>
    <textarea id="note" placeholder="เช่น ของหมดตั้งแต่เมื่อวาน ถ้าได้ภายในพรุ่งนี้เช้าจะดีมาก รับได้ทีละ 20 แผงก่อน"></textarea>

    <!-- ผู้ช่วย AI ระดับ 1 — อ่านรายละเอียดแล้วเสนอรายการยากับความเร่งด่วน คนเป็นคนกดส่งเอง -->
    <div class="actions" style="margin-top:10px">
      <button type="button" id="aiPick" class="ghost">ให้ AI ช่วยเลือกรายการยาจากรายละเอียด</button>
    </div>
    <div id="aiBox" class="ai-box" hidden></div>

    <div class="actions">
      <button id="submit" class="primary" type="submit">ส่งคำขอ</button>
      <button type="button" class="ghost" onclick="location.href='index.html'">ยกเลิก</button>
    </div>
    <p class="msg" id="msg"></p>
  </form>

  <p class="hint" id="denied" hidden>
    หน้านี้สำหรับร้านยา / คลินิก เท่านั้น — ผู้แทนยาเป็นฝ่ายรับคำขอ ไม่ใช่ฝ่ายสร้าง
    <br><a href="index.html">กลับไปหน้ารายการ</a>
  </p>
</div>

<script type="module">
import { collection, getDocs, query, where, doc, writeBatch, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { db, STATUS, URGENCY } from "./app/db.js";
import { requireAuth, ROLE, ROLE_LABEL } from "./app/auth.js";
import { askAI, hasAiKey, parseJson } from "./app/ai.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const me = await requireAuth();
$("whoName").textContent = me.name;
$("whoRole").textContent = `${ROLE_LABEL[me.role]} · ${me.channel}`;

// ACL — ผู้แทนสร้างคำขอไม่ได้ ปุ่มและหน้าต้องปิดตามตารางสิทธิ์
if (me.role !== ROLE.BUYER) {
  $("sub").textContent = "ไม่มีสิทธิ์เข้าหน้านี้";
  $("denied").hidden = false;
} else {
  $("sub").textContent = `คำขอจะถูกส่งไปหาผู้แทนช่องทาง ${me.channel} ในเขตใกล้เคียง`;
  await loadProducts();
  $("urgency").innerHTML = Object.values(URGENCY)
    .map(u => `<option${u === URGENCY.NORMAL ? " selected" : ""}>${u}</option>`).join("");
  $("form").hidden = false;
  await setupAi();
}

// OTC/MC เป็น hard gate — เห็นเฉพาะรายการยาในช่องทางเดียวกับโปรไฟล์
async function loadProducts() {
  const snap = await getDocs(query(collection(db, "products"), where("channel", "==", me.channel)));
  const opts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  $("product").innerHTML = opts.length
    ? opts.map(p => `<option value="${p.id}" data-name="${p.name.replace(/"/g,"&quot;")}">${p.name}</option>`).join("")
    : `<option value="">— ยังไม่มีรายการยาในช่องทาง ${me.channel} —</option>`;
  if (!opts.length) $("submit").disabled = true;
}

// ── ผู้ช่วย AI ระดับ 1 ─────────────────────────────────────────
// ร้านพิมพ์เป็นภาษาคน เช่น "พารา 500 หมดเกลี้ยง ขอด่วนภายในวันนี้"
// AI อ่านแล้วเสนอรายการยาที่ตรงที่สุด + ความเร่งด่วน · เป็นแค่ข้อเสนอ คนแก้ได้ก่อนกดส่ง

async function setupAi() {
  if (!(await hasAiKey())) {
    $("aiPick").disabled = true;
    $("aiPick").title = "ยังไม่ได้ใส่คีย์ AI";
    showAi("ยังไม่ได้ใส่คีย์ผู้ช่วย AI — เลือกรายการยาเองได้ตามปกติ", "muted");
    return;
  }
  $("aiPick").addEventListener("click", aiPick);
}

async function aiPick() {
  const note = $("note").value.trim();
  if (!note) return showAi("พิมพ์รายละเอียดก่อน เช่น ต้องการยาอะไร ด่วนแค่ไหน แล้วค่อยกดปุ่มนี้", "muted");

  const options = [...$("product").options].filter(o => o.value);
  if (!options.length) return showAi("ยังไม่มีรายการยาในช่องทางของคุณให้เลือก", "muted");

  // ระหว่างรอ: บอกว่ากำลังทำงาน และกดซ้ำไม่ได้
  const btn = $("aiPick");
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "กำลังให้ AI อ่านรายละเอียด...";
  showAi("กำลังส่งรายละเอียดไปให้ AI อ่าน (รอได้ไม่เกิน 15 วินาที)...", "muted");

  try {
    const answer = await askAI(
      "คุณเป็นผู้ช่วยของร้านขายยา อ่านข้อความที่ร้านพิมพ์ แล้วเลือกรายการยาที่ตรงที่สุด " +
      "จากรายการที่ให้ไว้เท่านั้น พร้อมระดับความเร่งด่วน " +
      "ตอบเป็น JSON อย่างเดียว รูปแบบ " +
      `{"product":"ชื่อรายการยาตามรายการทุกตัวอักษร หรือ ไม่ทราบ",` +
      `"urgency":"${Object.values(URGENCY).join(" หรือ ")}",` +
      `"reason":"เหตุผลสั้น ๆ ไม่เกิน 1 ประโยค"}`,
      "รายการยาที่มีในระบบ:\n- " + options.map(o => o.dataset.name).join("\n- ") +
      "\n\nข้อความที่ร้านพิมพ์:\n" + note
    );
    const out = parseJson(answer);

    // ผลต้องเป็นรายการยาที่มีอยู่จริงเท่านั้น ไม่ตรงก็ไม่แตะค่าเดิม
    const opt = options.find(o => o.dataset.name === String(out?.product ?? "").trim());
    if (!opt) {
      return showAi("AI จับคู่กับรายการยาในระบบไม่ได้ — กรุณาเลือกเอง (ค่าเดิมไม่ถูกเปลี่ยน)", "muted");
    }
    $("product").value = opt.value;
    const urgencyOk = Object.values(URGENCY).includes(out.urgency);
    if (urgencyOk) $("urgency").value = out.urgency;

    showAi(
      `<strong>ข้อเสนอจาก AI — โปรดตรวจสอบก่อนยืนยัน</strong><br>` +
      `รายการยา: ${esc(opt.dataset.name)}` +
      (urgencyOk ? ` · ความเร่งด่วน: ${esc(out.urgency)}` : "") +
      (out.reason ? `<br><span class="meta">${esc(out.reason)}</span>` : "") +
      `<br><span class="meta">แก้ได้ทุกช่องก่อนกด "ส่งคำขอ" — AI ไม่ได้ส่งคำขอให้</span>`,
      "ai"
    );
  } catch (err) {
    // เรียกไม่สำเร็จ ระบบต้องไม่ค้าง ยังเลือกเองแล้วกดส่งได้
    showAi(`เรียก AI ไม่สำเร็จ — ${esc(err.message)} · เลือกรายการยาเองแล้วกดส่งคำขอได้ตามปกติ`, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function showAi(html, kind) {
  $("aiBox").innerHTML = html;
  $("aiBox").className = "ai-box " + kind;
  $("aiBox").hidden = false;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("submit").disabled = true;
  $("msg").className = "msg";
  $("msg").textContent = "กำลังบันทึก...";
  try {
    const opt = $("product").selectedOptions[0];

    // 🔴 เส้นแดงข้อ 5 (PDPA) — ชื่อร้านไม่อยู่บนเอกสารคำขออีกต่อไป
    // เอกสารคำขอเก็บได้แค่ "เขต" ส่วนชื่อร้านไปอยู่ requests/{id}/identity/buyer
    // ซึ่งกฎเปิดให้อ่านเฉพาะร้านเจ้าของ กับผู้แทนคนที่กดรับใบนี้แล้วเท่านั้น
    //
    // ต้องเขียนสองเอกสารให้จบในก้อนเดียวด้วย writeBatch
    // ถ้าแยกเป็นสองจังหวะแล้วจังหวะสองพัง จะได้คำขอที่ไม่มีชื่อร้านค้างอยู่ในระบบ กู้ไม่ได้
    const ref = doc(collection(db, "requests"));   // สร้าง id ล่วงหน้า ยังไม่เขียนอะไร
    const batch = writeBatch(db);

    batch.set(ref, {
      buyerId: me.uid,                 // uid ของคนที่ล็อกอินอยู่
      buyerChannel: me.channel,
      buyerArea: me.area || "",        // ผู้แทนเห็นได้แค่ "เขต" ก่อนกดรับ
      productId: opt.value,
      productName: opt.dataset.name,   // จดชื่อซ้ำ ไม่ใช่ข้อมูลอ่อนไหว
      qty: Number($("qty").value),
      unit: $("unit").value,
      note: $("note").value.trim(),
      urgency: $("urgency").value,
      status: STATUS.PENDING,          // สถานะเริ่มต้น
      createdAt: serverTimestamp(),
    });

    batch.set(doc(db, "requests", ref.id, "identity", "buyer"), {
      buyerName: me.name,              // ช่องอ่อนไหวช่องเดียวของตอนนี้ · ที่อยู่/เบอร์จะมาอยู่ที่นี่ในอนาคต
    });

    await batch.commit();
    location.href = "index.html";
  } catch (err) {
    $("msg").className = "msg err";
    $("msg").textContent = "บันทึกไม่สำเร็จ: " + (err.code || err.message);
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
