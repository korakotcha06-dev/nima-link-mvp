<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMA Link — รายการคำขอหายา</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>รายการคำขอหายา</h1>
      <p class="sub" id="sub">กำลังโหลด...</p>
    </div>
    <div class="who">
      <strong id="whoName">—</strong>
      <span id="whoRole"></span>
      <div class="actions" style="margin-top:8px">
        <button id="signout" class="ghost">ออกจากระบบ</button>
      </div>
    </div>
  </div>

  <div class="bar" id="bar" hidden>
    <button id="btnNew" class="primary" hidden>+ สร้างคำขอใหม่</button>
    <button id="btnCatalog" class="ghost" hidden>ดูแคตตาล็อกรายการยา</button>
  </div>

  <div class="card" id="tools" hidden>
    <label for="q">ค้นหา</label>
    <input id="q" type="search" placeholder="ชื่อยา · รายละเอียด · เขต">
    <div class="two">
      <div>
        <label for="fStatus">สถานะ</label>
        <select id="fStatus"></select>
      </div>
      <div>
        <label for="fSort">เรียงตาม</label>
        <select id="fSort">
          <option value="new">ใหม่ → เก่า</option>
          <option value="old">เก่า → ใหม่</option>
          <option value="urgency">ความเร่งด่วน</option>
          <option value="qty">จำนวน (มาก → น้อย)</option>
        </select>
      </div>
    </div>
  </div>

  <div id="list"></div>
  <p class="log" id="log"></p>
</div>

<script type="module">
import { collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { db, STATUS, URGENCY } from "./app/db.js";
import { requireAuth, mountSignOut, ROLE, ROLE_LABEL } from "./app/auth.js";

const $ = id => document.getElementById(id);
const badgeClass = { [STATUS.PENDING]:"pending", [STATUS.ACCEPTED]:"accepted", [STATUS.REJECTED]:"rejected" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const me = await requireAuth();
mountSignOut($("signout"));
$("whoName").textContent = me.name;
$("whoRole").textContent = `${ROLE_LABEL[me.role]} · ${me.channel}`;

// ปุ่มบนหน้าจอเปลี่ยนตามบทบาทจริงที่อ่านจาก users/{uid} — ตรงตาม ACL.md
const isBuyer = me.role === ROLE.BUYER;
// แถบปุ่มโผล่ทั้งสองบทบาท แต่ปุ่มข้างในคนละใบ — ร้านสร้างคำขอ · ผู้แทนเปิดแคตตาล็อก
$("bar").hidden = false;
$("btnNew").hidden = !isBuyer;
$("btnCatalog").hidden = isBuyer;
$("btnNew").onclick = () => location.href = "new.html";
$("btnCatalog").onclick = () => location.href = "catalog.html";

// ตัวเลือกสถานะอ่านจาก STATUS ที่เดียว ห้าม hardcode สตริงไทยกระจาย
$("fStatus").innerHTML = `<option value="">ทุกสถานะ</option>` +
  Object.values(STATUS).map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
$("q").addEventListener("input", applyFilters);
$("fStatus").addEventListener("change", applyFilters);
$("fSort").addEventListener("change", applyFilters);

$("sub").textContent = isBuyer
  ? "คำขอที่ร้านของคุณส่งไป — ร้านอื่นมองไม่เห็น"
  : `คำขอในช่องทาง ${me.channel} ที่รอผู้แทนรับ — ชื่อร้านจะเปิดเผยหลังกดรับคำขอ`;

// 🔴 เส้นแดงข้อ 5 (PDPA) — ผู้แทนเห็นชื่อร้านได้ต่อเมื่อ "ตัวเอง" เป็นคนกดรับใบนั้น
// ไม่ใช่แค่ "มีใครสักคนกดรับแล้ว" — ผู้แทนคนอื่นในช่องทางเดียวกันยังต้องไม่เห็น
// ชื่อร้านไม่อยู่บนเอกสารคำขอแล้ว ต้องอ่านจาก requests/{id}/identity/buyer ซึ่งกฎล็อกไว้อีกชั้น
function revealedToMe(r) {
  return !isBuyer && r.status === STATUS.ACCEPTED && r.acceptedBy === me.uid;
}

function buyerLabel(r) {
  if (isBuyer) return esc(me.name);                    // ชื่อร้านตัวเอง อ่านจากโปรไฟล์ ไม่ต้องยิงเพิ่ม
  if (revealedToMe(r) && r.revealedName) return esc(r.revealedName);
  return `<span class="masked">ร้านในเขต ${esc(r.buyerArea || "-")} (ยังไม่เปิดเผยชื่อ)</span>`;
}

// อ่านชื่อร้านจากโฟลเดอร์ย่อยที่ล็อกไว้ — ยิงเฉพาะใบที่ตัวเองกดรับแล้วเท่านั้น จำนวนจำกัดอยู่แล้ว
async function readBuyerName(requestId) {
  try {
    const s = await getDoc(doc(db, "requests", requestId, "identity", "buyer"));
    return s.exists() ? s.data().buyerName : "";
  } catch {
    return "";   // ถูกกฎปฏิเสธ หรือยังไม่มีเอกสาร → ปิดบังไว้ตามเดิม ไม่ทำให้ทั้งหน้าพัง
  }
}

// ── ค้นหา / กรอง / เรียง — ทำฝั่งหน้าเว็บทั้งหมด ────────────────────────────
// ห้ามเติม where หรือ orderBy ลงใน query เด็ดขาด กฎฝั่งฐานข้อมูลรับได้แค่ 2 รูปที่ยิงอยู่
// ใส่เพิ่มแล้ว query จะถูกปฏิเสธทั้งอัน ไม่ใช่แค่กรองไม่ได้
//
// ค้นหาได้จาก productName · note · buyerArea เท่านั้น
// ห้ามค้นด้วยชื่อร้าน — ไม่ได้อยู่บนเอกสารคำขอแล้ว และผู้แทนไม่มีสิทธิ์เห็นจนกว่าจะกดรับ
let allRows = [];

// ความเร่งด่วนเป็นค่าที่ "ร้านเลือกเอง" ไม่ใช่คะแนนที่ระบบคิดให้ จึงใช้เรียงได้
// โดยไม่ขัดข้อห้ามข้อ 1 ของโปรเจกต์ (ห้ามให้คะแนน / จัดอันดับ)
const URGENCY_ORDER = { [URGENCY.URGENT]: 0, [URGENCY.SOON]: 1, [URGENCY.NORMAL]: 2 };

function applyFilters() {
  const q = $("q").value.trim().toLowerCase();
  const wantStatus = $("fStatus").value;
  const sortBy = $("fSort").value;

  let rows = allRows.filter(r => {
    if (wantStatus && r.status !== wantStatus) return false;
    if (!q) return true;
    return [r.productName, r.note, r.buyerArea]
      .some(v => String(v ?? "").toLowerCase().includes(q));
  });

  const at = r => r.createdAt?.seconds ?? 0;
  rows = rows.slice().sort((a, b) =>
    sortBy === "old"     ? at(a) - at(b)
  : sortBy === "urgency" ? (URGENCY_ORDER[a.urgency] ?? 9) - (URGENCY_ORDER[b.urgency] ?? 9)
  : sortBy === "qty"     ? (Number(b.qty) || 0) - (Number(a.qty) || 0)
  :                        at(b) - at(a));

  $("log").textContent = allRows.length
    ? `แสดง ${rows.length} จาก ${allRows.length} รายการ · ${new Date().toLocaleString("th-TH")}`
    : "";
  render(rows, q !== "" || wantStatus !== "");
}

function render(rows, filtering) {
  if (!rows.length) {
    // "กรองแล้วไม่เจอ" กับ "ยังไม่มีคำขอเลย" เป็นคนละเรื่อง ต้องบอกให้ต่างกัน
    $("list").innerHTML = filtering
      ? `<p class="hint">ไม่พบคำขอที่ตรงกับเงื่อนไขที่เลือก</p>`
      : isBuyer
        ? `<p class="hint">ยังไม่มีคำขอของร้านคุณ — กด "สร้างคำขอใหม่" เพื่อเริ่ม</p>`
        : `<p class="hint">ยังไม่มีคำขอในช่องทาง ${esc(me.channel)}</p>`;
    return;
  }
  $("list").innerHTML = rows.map(r => `
    <a class="card link" href="detail.html?id=${encodeURIComponent(r.id)}" style="display:block;color:inherit">
      <div class="row">
        <span class="name">${buyerLabel(r)}</span>
        <span class="badge ${badgeClass[r.status] || "pending"}">${esc(r.status)}</span>
      </div>
      <div class="meta">${esc(r.productName)} · ${esc(r.qty)} ${esc(r.unit || "หน่วย")} · ช่องทาง ${esc(r.buyerChannel)}</div>
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ""}
    </a>`).join("");
}

async function load() {
  try {
    // กรองด้วย where ตัวเดียวแล้วเรียงฝั่งหน้าเว็บ
    // where + orderBy คนละช่องต้องสร้าง composite index — ที่ขนาดข้อมูลเท่านี้ยังไม่คุ้ม
    const q = isBuyer
      ? query(collection(db, "requests"), where("buyerId", "==", me.uid))
      : query(collection(db, "requests"), where("buyerChannel", "==", me.channel));

    const snap = await getDocs(q);
    const rows = snap.docs
      .map(d => {
        // buyerName ถูกย้ายออกไป identity/buyer แล้ว — เอกสารเก่าที่ยังมีช่องนี้ค้างอยู่ให้ทิ้งทันที
        // ห้าม fallback ไปหยิบของเก่ามาโชว์ ไม่งั้นรูเดิมก็ยังเปิดอยู่กับข้อมูลเก่า
        const { buyerName, ...rest } = d.data();
        return { id: d.id, ...rest };          // Document ID ไม่ใช่ field ต้องประกอบกลับเอง
      })
      .sort((a, b) => (b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));

    // ผู้แทน: เปิดชื่อร้านเฉพาะใบที่ตัวเองกดรับ — ยิงทีละใบเท่าที่จำเป็น
    await Promise.all(rows.filter(revealedToMe)
      .map(async r => { r.revealedName = await readBuyerName(r.id); }));

    allRows = rows;
    $("tools").hidden = false;
    applyFilters();
  } catch (e) {
    $("list").innerHTML = `<p class="hint">อ่านข้อมูลไม่ได้: ${esc(e.code || e.message)}</p>`;
  }
}
load();
</script>
</body>
</html>
