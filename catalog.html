<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMA Link — แคตตาล็อกรายการยา</title>
<link rel="stylesheet" href="app/style.css">
<style>
  /* เฉพาะหน้านี้ — ช่องค้นหาแบบกรองทันที ใช้ตัวแปรสีเดิมจาก style.css เท่านั้น */
  .search-box { margin-bottom: 16px; }
  .catalog-list { display: grid; gap: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>แคตตาล็อกรายการยา</h1>
      <p class="sub" id="sub">กำลังโหลด...</p>
    </div>
    <div class="who">
      <strong id="whoName">—</strong>
      <span id="whoRole"></span>
      <div class="actions" style="margin-top:8px">
        <button id="signout" class="ghost">ออกจากระบบ</button>
      </div>
    </div>
  </div>

  <div id="content" hidden>
    <p class="hint" style="margin-bottom:16px"><a href="index.html">กลับไปหน้ารายการคำขอ</a></p>

    <div class="search-box">
      <label for="search">ค้นหารายการยา</label>
      <input id="search" type="text" placeholder="พิมพ์ชื่อยาหรือบริษัทเพื่อกรอง...">
    </div>

    <div class="catalog-list" id="list"></div>
  </div>

  <p class="hint" id="denied" hidden>
    หน้านี้สำหรับผู้แทนยาเท่านั้น — ร้านยา/คลินิกไม่มีสิทธิ์ดูแคตตาล็อกนี้
    <br><a href="index.html">กลับไปหน้ารายการ</a>
  </p>
</div>

<script type="module">
import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { db } from "./app/db.js";
import { requireAuth, mountSignOut, ROLE, ROLE_LABEL } from "./app/auth.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const me = await requireAuth();
mountSignOut($("signout"));
$("whoName").textContent = me.name;
$("whoRole").textContent = `${ROLE_LABEL[me.role]} · ${me.channel}`;

// role gate — หน้านี้สำหรับผู้แทนเท่านั้น ร้านยา/คลินิกเข้าไม่ได้
if (me.role !== ROLE.REP) {
  $("sub").textContent = "ไม่มีสิทธิ์เข้าหน้านี้";
  $("denied").hidden = false;
} else {
  $("sub").textContent = `รายการยาในช่องทาง ${me.channel} ที่ให้จับคู่ได้`;
  $("content").hidden = false;
  await loadCatalog();
}

let allProducts = [];

// OTC/MC เป็น hard gate — ยิง query กรองช่องทางเดียวกับโปรไฟล์เท่านั้น ไม่มีปุ่มให้สลับ
async function loadCatalog() {
  try {
    const snap = await getDocs(query(collection(db, "products"), where("channel", "==", me.channel)));
    allProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render(allProducts);
    $("search").addEventListener("input", () => {
      const q = $("search").value.trim().toLowerCase();
      const filtered = !q
        ? allProducts
        : allProducts.filter(p =>
            String(p.name ?? "").toLowerCase().includes(q) ||
            String(p.company ?? "").toLowerCase().includes(q));
      render(filtered);
    });
  } catch (e) {
    $("list").innerHTML = `<p class="hint">อ่านข้อมูลไม่ได้: ${esc(e.code || e.message)}</p>`;
  }
}

function render(rows) {
  if (!allProducts.length) {
    $("list").innerHTML = `<p class="hint">ยังไม่มีรายการยาในช่องทางนี้</p>`;
    return;
  }
  if (!rows.length) {
    $("list").innerHTML = `<p class="hint">ไม่พบรายการยาที่ตรงกับคำค้นหา</p>`;
    return;
  }
  $("list").innerHTML = rows.map(p => `
    <div class="card">
      <div class="row">
        <span class="name">${esc(p.name)}</span>
      </div>
      <div class="meta">${esc(p.company || "-")}</div>
    </div>`).join("");
}
</script>
</body>
</html>
