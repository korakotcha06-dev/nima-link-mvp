<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMA Link — รายละเอียดคำขอ</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="wrap" style="max-width:620px">
  <div class="top">
    <div>
      <h1>รายละเอียดคำขอ</h1>
      <p class="sub"><a href="index.html">&larr; กลับไปหน้ารายการ</a></p>
    </div>
    <div class="who">
      <strong id="whoName">—</strong>
      <span id="whoRole"></span>
    </div>
  </div>

  <div id="body"><p class="hint">กำลังโหลด...</p></div>

  <!-- ผู้ช่วย AI ระดับ 2 — ไปอ่านข้อมูลหลายที่เอง แล้วสรุปให้ผู้แทนอ่านก่อนตัดสินใจรับหรือปฏิเสธ -->
  <div id="aiCard" class="card" hidden>
    <div class="row"><span class="name">ผู้ช่วยสรุปคำขอให้ผู้แทน</span></div>
    <p class="meta">
      AI จะอ่าน 4 อย่างให้เอง — คำขอใบนี้ · ข้อมูลรายการยา · คำตอบที่ผู้แทนเขียนไว้แล้ว ·
      คำขอรายการเดียวกันที่ยังรออยู่ในช่องทางนี้ — แล้วสรุปให้อ่าน
      <strong>AI ไม่กดรับหรือปฏิเสธแทนคุณ</strong>
    </p>
    <div class="actions" style="margin-top:12px">
      <button type="button" id="aiSummarize" class="ghost">ให้ AI สรุปคำขอนี้</button>
    </div>
    <div id="aiResult" class="ai-box" hidden></div>
  </div>
</div>

<script type="module">
import {
  doc, getDoc, updateDoc, deleteDoc,
  collection, getDocs, addDoc, query, where, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { db, STATUS } from "./app/db.js";
import { requireAuth, ROLE, ROLE_LABEL } from "./app/auth.js";
import { askAI, hasAiKey, aiModel, parseJson } from "./app/ai.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const badgeClass = { [STATUS.PENDING]:"pending", [STATUS.ACCEPTED]:"accepted", [STATUS.REJECTED]:"rejected" };

const id = new URLSearchParams(location.search).get("id");
const me = await requireAuth();
$("whoName").textContent = me.name;
$("whoRole").textContent = `${ROLE_LABEL[me.role]} · ${me.channel}`;

const isBuyer = me.role === ROLE.BUYER;
const ref = doc(db, "requests", id);

function deny(reason) {
  $("body").innerHTML = `<p class="hint">${esc(reason)}<br><a href="index.html">กลับไปหน้ารายการ</a></p>`;
}

// ชื่อร้านอยู่ในเอกสารที่ล็อกแยกไว้ — กฎเปิดให้เฉพาะร้านเจ้าของ กับผู้แทนคนที่กดรับใบนี้
async function readBuyerName() {
  try {
    const s = await getDoc(doc(db, "requests", id, "identity", "buyer"));
    return s.exists() ? s.data().buyerName : "";
  } catch {
    return "";   // ถูกกฎปฏิเสธ หรือยังไม่มีเอกสาร → ปิดบังไว้ตามเดิม ไม่ทำให้ทั้งหน้าพัง
  }
}

async function load() {
  if (!id) return deny("ไม่ได้ระบุว่าเป็นคำขอใบไหน");

  // กฎฝั่งฐานข้อมูลปฏิเสธการอ่านคำขอที่ไม่ใช่ของเรา การอ่านจึง "โยน" ไม่ใช่ "คืนค่าว่าง"
  // ถ้าไม่รับไว้ตรงนี้ คนที่แก้ URL ไปเปิดคำขอร้านอื่นจะค้างที่ "กำลังโหลด..." ตลอดไป
  let snap;
  try {
    snap = await getDoc(ref);
  } catch (e) {
    return deny(e.code === "permission-denied"
      ? "คุณไม่มีสิทธิ์ดูคำขอใบนี้"
      : "อ่านคำขอไม่ได้: " + (e.code || e.message));
  }
  if (!snap.exists()) return deny("ไม่พบคำขอใบนี้ อาจถูกลบไปแล้ว");

  // buyerName ถูกย้ายออกไป requests/{id}/identity/buyer แล้ว
  // เอกสารเก่าที่ยังมีช่องนี้ค้างอยู่ให้ทิ้งตั้งแต่ตรงนี้ จะได้ไม่มีทางหลุดขึ้นจอ
  const { buyerName: _legacyBuyerName, ...r } = snap.data();

  // ACL — ร้านดูของร้านอื่นไม่ได้ · ผู้แทนดูข้ามช่องทางไม่ได้ (OTC/MC hard gate)
  if (isBuyer && r.buyerId !== me.uid) return deny("คำขอใบนี้เป็นของร้านอื่น คุณไม่มีสิทธิ์ดู");
  if (!isBuyer && r.buyerChannel !== me.channel) return deny(`คำขอใบนี้อยู่ช่องทาง ${r.buyerChannel} คนละช่องทางกับคุณ`);

  // 🔴 เส้นแดงข้อ 5 (PDPA) — ผู้แทนเห็นชื่อร้านได้ต่อเมื่อ "ตัวเอง" เป็นคนกดรับใบนี้
  // เงื่อนไขเดิมถามแค่ว่าสถานะเป็น "รับแล้ว" หรือยัง ไม่ได้ถามว่าใครรับ
  // ผู้แทนคนอื่นทั้งช่องทางจึงเห็นชื่อร้านตามไปด้วย — ผิด ACL ที่ว่า "หลังกดรับแล้วเท่านั้น"
  const revealedToMe = !isBuyer && r.status === STATUS.ACCEPTED && r.acceptedBy === me.uid;
  const masked = `<span class="masked">ร้านในเขต ${esc(r.buyerArea || "-")} (ยังไม่เปิดเผยชื่อ)</span>`;

  let buyerLine = masked;
  if (isBuyer) {
    buyerLine = esc(me.name);                       // ชื่อร้านตัวเอง อ่านจากโปรไฟล์ ไม่ต้องยิงเพิ่ม
  } else if (revealedToMe) {
    const name = await readBuyerName();             // กฎจะปฏิเสธถ้าไม่ใช่คนที่กดรับ
    if (name) buyerLine = esc(name);
  }

  const canChangeStatus = !isBuyer && r.status === STATUS.PENDING;  // ผู้แทนเท่านั้น และเปลี่ยนได้ครั้งเดียว
  const canDelete = isBuyer && r.buyerId === me.uid;                // ร้านเจ้าของเท่านั้น

  $("body").innerHTML = `
    <div class="card">
      <div class="row">
        <span class="name">${buyerLine}</span>
        <span class="badge ${badgeClass[r.status] || "pending"}">${esc(r.status)}</span>
      </div>
      <dl class="kv">
        <dt>รายการยา</dt><dd>${esc(r.productName)}</dd>
        <dt>จำนวน</dt><dd>${esc(r.qty)} ${esc(r.unit || "หน่วย")}</dd>
        <dt>ความเร่งด่วน</dt><dd>${esc(r.urgency || "-")}</dd>
        <dt>ช่องทาง</dt><dd>${esc(r.buyerChannel)}</dd>
        <dt>เขต</dt><dd>${esc(r.buyerArea || "-")}</dd>
        <dt>รายละเอียด</dt><dd>${esc(r.note) || "-"}</dd>
        <dt>ส่งเมื่อ</dt><dd>${r.createdAt?.toDate ? r.createdAt.toDate().toLocaleString("th-TH") : "-"}</dd>
      </dl>

      ${canChangeStatus ? `
        <div class="actions">
          <button id="accept" class="primary">รับคำขอ</button>
          <button id="reject" class="ghost">ปฏิเสธ</button>
        </div>
        <p class="meta" style="margin-top:8px">กดรับแล้วชื่อและที่อยู่ร้านจะเปิดเผยให้คุณเห็น</p>` : ""}

      ${!isBuyer && !canChangeStatus ? `<p class="meta">คำขอใบนี้ตอบไปแล้ว เปลี่ยนสถานะซ้ำไม่ได้</p>` : ""}
      ${isBuyer ? `<p class="meta">สถานะเปลี่ยนโดยผู้แทนเท่านั้น — คุณอนุมัติคำขอของตัวเองไม่ได้</p>` : ""}

      ${canDelete ? `
        <div class="actions">
          <button id="askDelete" class="danger">ลบคำขอนี้</button>
        </div>
        <div id="confirmBox" class="hint" hidden style="margin-top:12px">
          ลบแล้วกู้คืนไม่ได้ ยืนยันจะลบคำขอนี้หรือไม่
          <div class="actions">
            <button id="doDelete" class="danger">ยืนยันลบ</button>
            <button id="cancelDelete" class="ghost">ยกเลิก</button>
          </div>
        </div>` : ""}

      <p class="msg" id="msg"></p>
    </div>`;

  if (canChangeStatus) {
    $("accept").onclick = () => setStatus(STATUS.ACCEPTED);
    $("reject").onclick = () => setStatus(STATUS.REJECTED);
  }
  if (canDelete) {
    // ถามยืนยันก่อนลบทุกครั้ง — ใช้กล่องในหน้า ไม่ใช่ confirm() ของเบราว์เซอร์
    $("askDelete").onclick    = () => { $("confirmBox").hidden = false; $("askDelete").disabled = true; };
    $("cancelDelete").onclick = () => { $("confirmBox").hidden = true;  $("askDelete").disabled = false; };
    $("doDelete").onclick     = remove;
  }
  await setupAi({ id: snap.id, ...r });
}

// ── ผู้ช่วย AI ระดับ 2 (agentic) ───────────────────────────────
// ต่างจากระดับ 1 ที่ถามครั้งเดียว: ตัวนี้ไปอ่านข้อมูลเองหลายที่ → สรุปให้คนอ่าน
// → เขียนผลกลับลงคำขอ (aiSuggestion · aiReason) → จดบันทึกลงโฟลเดอร์ย่อย aiLog
// สถานะคำขอไม่เปลี่ยนเอง ต้องให้ผู้แทนกดรับหรือปฏิเสธเท่านั้น

let current = null;     // คำขอที่เปิดอยู่
let aiWired = false;    // ผูกปุ่มครั้งเดียว load() ถูกเรียกซ้ำหลังเปลี่ยนสถานะ

async function setupAi(r) {
  current = r;
  if (isBuyer) return;  // ผู้ช่วยตัวนี้มีไว้ให้ผู้แทนอ่านก่อนตัดสินใจ
  $("aiCard").hidden = false;
  if (r.aiSuggestion) showSummary(r.aiSuggestion, r.aiReason, r.aiUpdatedAt);

  if (!(await hasAiKey())) {
    $("aiSummarize").disabled = true;
    $("aiSummarize").title = "ยังไม่ได้ใส่คีย์ AI";
    if (!r.aiSuggestion) showAiMsg("ยังไม่ได้ใส่คีย์ผู้ช่วย AI — อ่านรายละเอียดแล้วตัดสินใจเองได้ตามปกติ", "muted");
    return;
  }
  if (!aiWired) { $("aiSummarize").addEventListener("click", summarize); aiWired = true; }
}

async function summarize() {
  const r = current;
  const btn = $("aiSummarize");
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = "กำลังให้ AI อ่านข้อมูล...";
  const steps = [];  // AI ไปอ่านอะไรมาบ้าง — เก็บลง aiLog ให้ตรวจย้อนหลังได้

  try {
    // ขั้นที่ 1 — คำขอใบนี้ (ไม่ส่งชื่อร้านให้ AI เด็ดขาด ใช้แค่เขต ตามเส้นแดงข้อ 5)
    showAiMsg("ขั้นที่ 1/4 — อ่านคำขอใบนี้...", "muted");
    steps.push(`อ่านคำขอ ${r.id}`);

    // ขั้นที่ 2 — ข้อมูลรายการยาจากโฟลเดอร์ products
    showAiMsg("ขั้นที่ 2/4 — อ่านข้อมูลรายการยา...", "muted");
    const p = r.productId ? await getDoc(doc(db, "products", r.productId)) : null;
    const product = p?.exists() ? p.data() : null;
    steps.push(product ? `อ่านรายการยา ${r.productId}` : "ไม่พบข้อมูลรายการยาในโฟลเดอร์ products");

    // ขั้นที่ 3 — คำตอบที่ผู้แทนเขียนไว้แล้วในโฟลเดอร์ย่อย replies
    showAiMsg("ขั้นที่ 3/4 — อ่านคำตอบของผู้แทนในคำขอนี้...", "muted");
    const rs = await getDocs(collection(db, "requests", r.id, "replies"));
    const replies = rs.docs.map(d => d.data());
    steps.push(`อ่าน replies ${replies.length} รายการ`);

    // ขั้นที่ 4 — คำขอรายการยาเดียวกันที่ยังรออยู่ในช่องทางเดียวกัน (ดูว่ามีความต้องการซ้ำในเขตไหน)
    showAiMsg("ขั้นที่ 4/4 — ค้นคำขอรายการเดียวกันที่ยังรออยู่ แล้วส่งให้ AI สรุป...", "muted");
    // กรองด้วย where ตัวเดียวคือ buyerChannel แล้วคัด productId กับ status ฝั่งหน้าเว็บ
    // เหตุผล: กฎ list ของ requests รับได้แค่รูป buyerId ของตัวเอง หรือ buyerChannel ของผู้แทน
    // ถ้ายิงด้วย productId เฉย ๆ จะโดนปฏิเสธทั้ง query · และวิธีนี้ยังเลี่ยง composite index ตามสำนวนเดิมของโปรเจกต์
    const qs = await getDocs(query(collection(db, "requests"), where("buyerChannel", "==", me.channel)));
    const others = qs.docs
      // ทิ้ง buyerName ของเอกสารเก่าตั้งแต่ต้นทาง — prompt ของ AI ต้องไม่มีชื่อร้านเด็ดขาด ใช้ได้แค่ "เขต"
      .map(d => { const { buyerName, ...rest } = d.data(); return { id: d.id, ...rest }; })
      .filter(x => x.id !== r.id && x.productId === r.productId && x.status === STATUS.PENDING);
    steps.push(`พบคำขอรายการเดียวกันที่ยังรออยู่ ${others.length} ใบ`);

    const input =
      "คำขอที่กำลังพิจารณา\n" +
      `รายการยา: ${r.productName}\n` +
      (product ? `บริษัท: ${product.company || "-"}\n` : "") +
      `จำนวน: ${r.qty} ${r.unit || "หน่วย"}\n` +
      `ช่องทาง: ${r.buyerChannel} · เขต: ${r.buyerArea || "-"}\n` +
      `ความเร่งด่วนที่ร้านเลือก: ${r.urgency || "ไม่ระบุ"}\n` +
      `รายละเอียดที่ร้านพิมพ์: ${r.note || "-"}\n\n` +
      `คำตอบของผู้แทนที่มีอยู่แล้ว (${replies.length})\n` +
      (replies.length ? replies.map(x => `- ${x.message || "-"}`).join("\n") : "- ยังไม่มี") + "\n\n" +
      `คำขอรายการเดียวกันที่ยังรออยู่ในช่องทางนี้ (${others.length})\n` +
      (others.length
        ? others.map(x => `- เขต ${x.buyerArea || "-"} · ${x.qty} ${x.unit || ""} · ${x.urgency || "ไม่ระบุ"}`).join("\n")
        : "- ไม่มี");

    const answer = await askAI(
      "คุณเป็นผู้ช่วยของผู้แทนยา กำลังจะตัดสินใจว่าจะรับคำขอหายาใบนี้หรือไม่ " +
      "สรุปเป็นภาษาไทยให้อ่านจบใน 30 วินาที " +
      "กติกา: ห้ามตัดสินใจแทน ห้ามบอกว่าควรรับหรือไม่รับ · ห้ามให้คะแนน เปอร์เซ็นต์ ดาว หรือจัดอันดับ · " +
      "ห้ามพูดถึงราคา ค่าส่ง หรือการชำระเงิน · ห้ามเดาตารางเดินทางของผู้แทน · ใช้เฉพาะข้อมูลที่ให้ไว้ " +
      'ตอบเป็น JSON อย่างเดียว รูปแบบ {"summary":"ร้านต้องการอะไร เท่าไหร่ ด่วนแค่ไหน 1-2 ประโยค",' +
      '"reason":"สิ่งที่ควรดูก่อนตัดสินใจ 2-3 ข้อ คั่นด้วยขึ้นบรรทัดใหม่"}',
      input
    );
    const out = parseJson(answer);
    if (!out?.summary) throw new Error("อ่านคำตอบของ AI ไม่ออก ลองกดใหม่อีกครั้ง");
    const summary = String(out.summary).trim();
    const reason = String(out.reason ?? "").trim();

    // เขียนผลกลับลงคำขอ — แตะเฉพาะช่องของ AI ไม่แตะ status
    await updateDoc(ref, { aiSuggestion: summary, aiReason: reason, aiUpdatedAt: serverTimestamp() });

    // จดบันทึกทุกครั้งที่เรียก ลงโฟลเดอร์ย่อย requests/{id}/aiLog
    await addDoc(collection(db, "requests", r.id, "aiLog"), {
      input, output: answer, steps,
      model: await aiModel(),
      byUid: me.uid,
      createdAt: serverTimestamp(),
    });

    current = { ...r, aiSuggestion: summary, aiReason: reason };
    showSummary(summary, reason, null);
  } catch (err) {
    // เรียกไม่สำเร็จ ระบบต้องไม่ค้าง ปุ่มรับ/ปฏิเสธยังกดได้ตามปกติ
    showAiMsg(`เรียก AI ไม่สำเร็จ — ${esc(err.message)} · อ่านรายละเอียดแล้วกดรับหรือปฏิเสธเองได้ตามปกติ`, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function showSummary(summary, reason, at) {
  const when = at?.toDate ? ` · สรุปเมื่อ ${at.toDate().toLocaleString("th-TH")}` : "";
  const points = String(reason || "").split("\n").map(s => s.replace(/^[-•\d.)\s]+/, "").trim()).filter(Boolean);
  showAiMsg(
    `<strong>ข้อเสนอจาก AI — โปรดตรวจสอบก่อนยืนยัน</strong><br>${esc(summary)}` +
    (points.length ? `<ul class="ai-steps">${points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "") +
    `<p class="meta" style="margin:8px 0 0">AI สรุปให้อ่านเท่านั้น การรับหรือปฏิเสธเป็นการตัดสินใจของคุณ${when}</p>`,
    "ai"
  );
}

function showAiMsg(html, kind) {
  $("aiResult").innerHTML = html;
  $("aiResult").className = "ai-box " + kind;
  $("aiResult").hidden = false;
}

// แก้เฉพาะ status (กับ acceptedBy ตอนกดรับ) ช่องอื่นไม่แตะ
// กดรับต้องเซ็น acceptedBy ไปพร้อมกันในคำสั่งเดียว เพราะกฎบังคับไว้แบบนั้น
// และเป็นตัวที่เปิดสิทธิ์ให้ "คนกดรับคนนี้คนเดียว" อ่าน identity/buyer ได้
// กดปฏิเสธห้ามเขียน acceptedBy — การปฏิเสธไม่ทำให้ใครได้สิทธิ์เห็นชื่อร้าน
async function setStatus(next) {
  try {
    $("msg").className = "msg";
    $("msg").textContent = "กำลังบันทึก...";
    await updateDoc(ref, next === STATUS.ACCEPTED
      ? { status: next, acceptedBy: me.uid }
      : { status: next });
    await load();
  } catch (e) {
    $("msg").className = "msg err";
    $("msg").textContent = "เปลี่ยนสถานะไม่สำเร็จ: " + (e.code || e.message);
  }
}

async function remove() {
  try {
    $("doDelete").disabled = true;
    await deleteDoc(ref);
    location.href = "index.html";
  } catch (e) {
    $("msg").className = "msg err";
    $("msg").textContent = "ลบไม่สำเร็จ: " + (e.code || e.message);
    $("doDelete").disabled = false;
  }
}

load();
</script>
</body>
</html>
