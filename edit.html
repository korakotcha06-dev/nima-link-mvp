<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIMA Link — แก้ไขคำขอ</title>
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="wrap" style="max-width:560px">
  <div class="top">
    <div>
      <h1>แก้ไขคำขอหายา</h1>
      <p class="sub" id="sub">กำลังโหลด...</p>
    </div>
    <div class="who">
      <strong id="whoName">—</strong>
      <span id="whoRole"></span>
    </div>
  </div>

  <form id="form" class="card" hidden>
    <label for="product">รายการยาที่ต้องการ</label>
    <select id="product" required></select>

    <div class="two">
      <div>
        <label for="qty">จำนวน</label>
        <input id="qty" type="number" min="1" step="1" required>
      </div>
      <div>
        <label for="unit">หน่วย</label>
        <select id="unit">
          <option>แผง</option><option>กล่อง</option><option>ขวด</option>
          <option>ซอง</option><option>ลัง</option><option>ชิ้น</option>
        </select>
      </div>
    </div>

    <label for="urgency">ความเร่งด่วน</label>
    <select id="urgency"></select>

    <label for="note">รายละเอียดเพิ่มเติม</label>
    <textarea id="note"></textarea>

    <p class="meta" style="margin-top:10px">
      แก้ได้เฉพาะตอนที่ยังไม่มีผู้แทนตอบ — สถานะ ช่องทาง และเขต เปลี่ยนจากหน้านี้ไม่ได้
    </p>

    <div class="actions">
      <button id="submit" class="primary" type="submit">บันทึกการแก้ไข</button>
      <button type="button" id="cancel" class="ghost">ยกเลิก</button>
    </div>
    <p class="msg" id="msg"></p>
  </form>

  <p class="hint" id="denied" hidden></p>
</div>

<script type="module">
import { doc, getDoc, updateDoc, collection, getDocs, query, where }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { db, STATUS, URGENCY } from "./app/db.js";
import { requireAuth, ROLE, ROLE_LABEL } from "./app/auth.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const id = new URLSearchParams(location.search).get("id");
const me = await requireAuth();
$("whoName").textContent = me.name;
$("whoRole").textContent = `${ROLE_LABEL[me.role]} · ${me.channel}`;
$("cancel").onclick = () => location.href = id ? `detail.html?id=${encodeURIComponent(id)}` : "index.html";

function deny(reason) {
  $("sub").textContent = "แก้ไขไม่ได้";
  $("denied").innerHTML = `${esc(reason)}<br><a href="${id ? `detail.html?id=${encodeURIComponent(id)}` : "index.html"}">กลับไปหน้าก่อนหน้า</a>`;
  $("denied").hidden = false;
}

const ref = id ? doc(db, "requests", id) : null;

async function load() {
  if (!id) return deny("ไม่ได้ระบุว่าเป็นคำขอใบไหน");

  // ACL — ผู้แทนไม่ได้เป็นเจ้าของคำขอ จึงแก้ไม่ได้เลย ตัดตั้งแต่ก่อนยิงอ่าน
  if (me.role !== ROLE.BUYER) {
    return deny("หน้านี้สำหรับร้านยา / คลินิก เท่านั้น — ผู้แทนแก้ไขคำขอของร้านไม่ได้");
  }

  // กฎฝั่งฐานข้อมูลปฏิเสธการอ่านคำขอที่ไม่ใช่ของเรา การอ่านจึง "โยน" ไม่ใช่ "คืนค่าว่าง"
  let snap;
  try {
    snap = await getDoc(ref);
  } catch (e) {
    return deny(e.code === "permission-denied"
      ? "คุณไม่มีสิทธิ์แก้ไขคำขอใบนี้"
      : "อ่านคำขอไม่ได้: " + (e.code || e.message));
  }
  if (!snap.exists()) return deny("ไม่พบคำขอใบนี้ อาจถูกลบไปแล้ว");

  // buyerName ไม่ได้อยู่บนเอกสารคำขอแล้ว (ย้ายไป identity/buyer) — ทิ้งของเก่าตั้งแต่ต้นทาง
  const { buyerName, ...r } = snap.data();

  if (r.buyerId !== me.uid) return deny("คำขอใบนี้เป็นของร้านอื่น คุณไม่มีสิทธิ์แก้ไข");

  // แก้ได้เฉพาะตอนยังไม่มีใครตอบ — ผู้แทนตัดสินใจจากข้อมูลชุดไหน ต้องเป็นชุดนั้น
  if (r.status !== STATUS.PENDING) {
    return deny(`คำขอใบนี้สถานะ "${r.status}" แล้ว แก้ไขไม่ได้ — ผู้แทนตอบไปแล้วจากข้อมูลชุดเดิม`);
  }

  await fillProducts(r.productId);
  $("urgency").innerHTML = Object.values(URGENCY)
    .map(u => `<option${u === r.urgency ? " selected" : ""}>${u}</option>`).join("");
  $("qty").value = r.qty ?? 1;
  if (r.unit) {
    const unitOpt = [...$("unit").options].find(o => o.value === r.unit);
    if (unitOpt) $("unit").value = r.unit;
  }
  $("note").value = r.note ?? "";

  $("sub").textContent = `คำขอที่ส่งไปแล้ว · ยังอยู่ในสถานะ ${r.status}`;
  $("form").hidden = false;
}

// OTC/MC เป็น hard gate — เห็นเฉพาะรายการยาในช่องทางเดียวกับโปรไฟล์ เหมือน new.html
async function fillProducts(currentId) {
  const snap = await getDocs(query(collection(db, "products"), where("channel", "==", me.channel)));
  const opts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  if (!opts.length) {
    $("product").innerHTML = `<option value="">— ยังไม่มีรายการยาในช่องทาง ${esc(me.channel)} —</option>`;
    $("submit").disabled = true;
    return;
  }
  $("product").innerHTML = opts.map(p =>
    `<option value="${esc(p.id)}" data-name="${esc(p.name)}"${p.id === currentId ? " selected" : ""}>${esc(p.name)}</option>`
  ).join("");
  // รายการยาเดิมอาจถูกลบออกจากระบบไปแล้ว — ไม่มีให้เลือกก็ให้เลือกตัวแรกไว้ก่อน
  if (!opts.some(p => p.id === currentId)) $("product").selectedIndex = 0;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("submit").disabled = true;
  $("msg").className = "msg";
  $("msg").textContent = "กำลังบันทึก...";
  try {
    const opt = $("product").selectedOptions[0];
    // ส่งเฉพาะ 6 ช่องที่กฎอนุญาต — ช่องอื่นแตะไม่ได้และไม่ควรส่งไปให้ถูกปฏิเสธทั้งชุด
    // productId กับ productName ต้องไปด้วยกันเสมอ เพราะ productName เป็นชื่อที่จดซ้ำไว้ตั้งใจ
    await updateDoc(ref, {
      productId: opt.value,
      productName: opt.dataset.name,
      qty: Number($("qty").value),
      unit: $("unit").value,
      note: $("note").value.trim(),
      urgency: $("urgency").value,
    });
    location.href = `detail.html?id=${encodeURIComponent(id)}`;
  } catch (err) {
    $("msg").className = "msg err";
    $("msg").textContent = err.code === "permission-denied"
      ? "บันทึกไม่ได้ — คำขอใบนี้อาจมีผู้แทนตอบไปแล้วระหว่างที่คุณกำลังแก้ ลองเปิดหน้ารายละเอียดใหม่"
      : "บันทึกไม่สำเร็จ: " + (err.code || err.message);
    $("submit").disabled = false;
  }
});

load();
</script>
</body>
</html>
